inputs:
  packages:
    default: ""
    description: "The packages to install"
  cache-key:
    default: "1"
    description: "An additional key to invalidate caches by manually"
outputs:
  cache-hit:
    description: "Set to 'true' when the packages were installed from cache"
    value: "${{ steps.cache-apt.outputs.cache-hit }}"

# This action implements a very rudimentary way to cache apt package installs:
# Download the `*.deb` without installing, cache those, then install them.
# The one big caveat is packages with install scripts or `dpkg-configure` hooks may not work
# properly. Those will then have to be installed in a separate step.

# Caching uses both a hash on the given package list, and a date for weekly rotation.
# This should ensure that packages don't become out of date for too long.

runs:
  using: "composite"
  steps:
    # Create a cache invalidation key based on the current year + week.
    # This way, packages will be checked for updates once every week.
    - name: Get Date
      id: get-date
      run: echo "date=$(/bin/date -u "+%Y%W")" >> $GITHUB_OUTPUT

    - name: Write package list
      run: echo "${{ inputs.packages }}" > ./packages.txt

    - name: Cache apt packages
      id: cache-apt
      if: ${{ forgejo.actions }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: /var/cache/apt/archives
        # The trailing number serves as a version flag that can be incremented
        # to invalidate the cache after changing the list of packages.
        key: ${{ hashFiles('packages.txt') }}-${{ runner.os }}-${{ steps.get-date.outputs.date }}-apt-${{ inputs.cache-key }}

    - name: Download apt packages
      if: ${{ steps.cache-apt.outputs.cache-hit != 'true' || forgejo.actions != 'true' }}
      run: |
        apt-get update
        apt-get install -y --no-install-recommends --download-only $(echo "${{ inputs.packages }}" | tr '\n' ' ')

    - name: Install downloaded packages
      run: |
        apt-get install -y --no-install-recommends $(echo "${{ inputs.packages }}" | tr '\n' ' ')
